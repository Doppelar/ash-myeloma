<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASH 2026 疾患別演題索引</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf5f3;color:#16343d;font:16px/1.6 system-ui,sans-serif}header{background:#103a43;color:white}header .wrap{padding-block:25px}main,.wrap{max-width:1000px;margin:auto;padding:18px}h1,h2,p{margin:0 0 8px}h1{font-size:clamp(1.55rem,5vw,2.5rem)}a{color:#096458}header a{color:#b9f0e4}.kicker{font-weight:700;color:#adf0df}.tabs,.filters,.pager{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.tabs{margin-top:13px}.tabs a,.filters input,.filters select,.pager button{border:1px solid #8db4af;border-radius:8px;padding:6px 10px;font:inherit}.tabs a{text-decoration:none}.tabs a[aria-current=page]{background:#e2f7ee;color:#103a43}.panel,article{background:white;border:1px solid #c4d9d5;border-radius:12px;padding:14px;margin-bottom:10px}.filters input[type=search]{width:min(100%,350px)}.filters input,.filters select{background:white}.record{display:grid;gap:4px}.record h2{font-size:1.05rem;margin:0;overflow-wrap:anywhere}.record .meta,.hint{color:#42636b;font-size:.9rem}.topic{font-weight:700;color:#075e54}.pager{justify-content:flex-end}.pager button{background:white;cursor:pointer}.pager button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid #e0a42d;outline-offset:2px}
.category-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:8px}.category-list button{font:inherit;text-align:left;color:#16343d;background:#f2f8f6;border:1px solid #8db4af;border-radius:8px;padding:7px 10px;cursor:pointer}.category-list button[aria-pressed=true]{background:#096458;color:white;border-color:#096458}
</style>
</head>
<body>
<header><div class="wrap">
<p class="kicker">ASH 2026</p><h1 id="heading">疾患別演題索引</h1>
<a href="/">多発性骨髄腫の日本語ガイド</a>
<nav class="tabs" id="tabs" aria-label="疾患"></nav>
</div></header>
<main>
<section class="panel" id="topic-panel" aria-labelledby="topic-heading" hidden>
<h2 id="topic-heading">研究カテゴリー</h2>
<p class="hint">演題名の語句をもとに、各演題を1つのカテゴリーに分類しています。</p>
<div class="category-list" id="topics"></div>
</section>
<section class="panel" aria-label="検索と表示条件">
<p id="scope"></p>
<div class="filters">
<label for="q">キーワード</label><input id="q" type="search" placeholder="試験名・薬剤名など">
<label for="match">収載範囲</label><select id="match"><option value="all">公式検索の全演題</option><option value="title">疾患名が演題名にあるもの</option></select>
<label for="format">発表形式</label><select id="format"><option value="all">すべて</option><option value="oral">口頭</option><option value="poster">ポスター</option><option value="other">その他</option></select>
</div>
<p class="hint">演題名は公式サイトの英語表記です。日本語の研究テーマは演題名の語句をもとに表示します。</p>
</section>
<h2 id="count" aria-live="polite">読み込み中</h2>
<section id="records" aria-label="演題一覧"></section>
<div class="pager"><button id="prev" type="button">前へ</button><span id="page"></span><button id="next" type="button">次へ</button></div>
<p><a href="https://onlineprogram.hematology.org/">ASH公式プログラム</a></p>
</main>
<script type="module" src="/abstract-index.js"></script>
</body>
</html>
